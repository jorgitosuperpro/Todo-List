<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do list</title>
<script defer src="main.js"></script></head>
<body>
    <header>
        <img class = "to-do-svg" src="7fea759d4bc84f98cc12.svg" alt="">
        <h1>To-do</h1>
    </header>
    <div class="content">
        <div class="side-bar">
            <div class="side-bar-list">
                <div class="tasks-list">
                    <ul>
                        <div>
                            <img class = "inbox-svg" src="1d597db7b00e3fe4c267.svg" alt="">
                            <li class="inbox">Inbox</li>
                        </div>
                        <div>
                            <img class = "today-svg" src="67ee773f309302da17b8.svg" alt="">
                            <li class="today">Today</li>
                        </div>
                        <div>
                            <img class = "week-svg" src="e3ff51932ccd383dc880.svg" alt="">   
                            <li class="week">This Week</li>
                        </div>
                    </ul>
                </div>
                <div class="projects-header">
                    <img class = "projects-svg" src="9af2f202fda95cdea5b8.svg" alt="">
                    <h2>Projects</h2>
                    <button class="add-project">
                        Add Project
                    </button>
                </div>
                <div class="projects-list">

                </div>
            </div>
        </div>
        
        <div class="main">
            <h2 class="things-to-do">Things to do ✅</h2>
            <div class="buttons">
                <button class="add-task">
                    Add task
                </button>
            </div>
            <div class="tasks">

            </div>
        </div>
    </div>
    <footer>
        Jorge A © 2025
    </footer>
</body>
</html>

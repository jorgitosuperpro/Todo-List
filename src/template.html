<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do list</title>
</head>
<body>
    <header>
        <img class = "to-do-svg" src="images/to-do.svg" alt="">
        <h1>To-do</h1>
    </header>
    <div class="content">
        <div class="side-bar">
            <div class="side-bar-list">
                <div class="tasks-list">
                    <ul>
                        <div>
                            <img class = "inbox-svg" src="images/inbox.svg" alt="">
                            <li class="inbox">Inbox</li>
                        </div>
                        <div>
                            <img class = "today-svg" src="images/today.svg" alt="">
                            <li class="today">Today</li>
                        </div>
                        <div>
                            <img class = "week-svg" src="images/week.svg" alt="">   
                            <li class="week">This Week</li>
                        </div>
                    </ul>
                </div>
                <div class="projects-header">
                    <img class = "projects-svg" src="images/projects.svg" alt="">
                    <h2>Projects</h2>
                    <button class="add-project">
                        Add Project
                    </button>
                </div>
                <div class="projects-list">

                </div>
            </div>
        </div>
        
        <div class="main">
            <h2 class="things-to-do">Things to do ✅</h2>
            <div class="buttons">
                <button class="add-task">
                    Add task
                </button>
            </div>
            <div class="tasks">

            </div>
        </div>
    </div>
    <footer>
        Jorge A © 2025
    </footer>
</body>
</html>
